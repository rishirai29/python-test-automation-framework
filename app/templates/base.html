<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Demo Shop</title>
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#222}
    header{background:#132322;color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
    header a{color:#fff;margin-left:16px;text-decoration:none}
    main{max-width:900px;margin:24px auto;padding:0 16px}
    .inventory-item,.cart-item{background:#fff;border:1px solid #ddd;border-radius:6px;padding:12px 16px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}
    .item-price{font-weight:bold;margin:0 16px}
    button{padding:8px 14px;border:0;border-radius:4px;background:#3ddc91;cursor:pointer}
    button:disabled{background:#ccc;cursor:not-allowed}
    .error{background:#e2231a;color:#fff;padding:10px;border-radius:4px}
    .badge{background:#e2231a;border-radius:50%;padding:2px 8px;margin-left:4px}
    form.inline{display:inline;margin:0}
  </style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
