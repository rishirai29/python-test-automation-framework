[pytest]
pythonpath = .
testpaths = tests
addopts = -ra --import-mode=importlib --html=reports/report.html --self-contained-html --junitxml=reports/junit.xml
markers =
    smoke: fast sanity checks
    regression: full regression suite
    web: browser UI tests
    selenium: UI tests driven by Selenium WebDriver
    playwright: UI tests driven by Playwright
    api: REST API tests
    db: database validation tests
    bdd: pytest-bdd scenarios
